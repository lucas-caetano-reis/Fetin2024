{% extends 'main.html' %} <!-- extensão de main.html -->

{% block content  %}

<div style="border: solid;background-color:#ffdec7;border-color:#ffdec7; border-radius: 10px;">
    
    <h1 style="color:#493129; text-align: center;">Esta é a tela de login.</h1>


    <h1 style="text-align: center; color: #493129;"><form method="POST" action="">
        {% csrf_token %}

        <label>Usuario:</label>
        <input type="text" name="username" placeholder="Usuário"/>

        <label>Senha:</label>
        <input type="password" name="password" placeholder="Senha"/>

        <br>
        <br>

       <input type="submit" value="Login" style="border: none;border-radius: 10px; background-color: #a87598; color:#493129;font-size: 40px; font-family: 'Times New Roman', Times, serif; font-weight: bold;"/>
    </form></h1>
</div>
<a href="{% url 'Cadastro' %}">

    <h1 style="text-align: center;"><button style="font-size: 40px;background-color: #ffdec7; color: #493129; border-radius: 5px;border: none; position: relative; font-family: 'Times New Roman', Times, serif; font-weight: bold;">Ainda não se cadastrou?</button></h1>

</a>
