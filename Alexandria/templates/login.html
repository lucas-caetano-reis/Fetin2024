{% extends 'main.html' %} <!-- extensão de main.html -->

{% block content  %}

<div style="border: solid;background-color:goldenrod;border-color: rgb(139, 104, 15);">
    
    <h1 style="color:rgb(110, 7, 55);">Esta é a tela de login.</h1>

</div>

<div>
    <form method="POST" action="">
        {% csrf_token %}

        <label>Usuario:</label>
        <input type="text" name="username" placeholder="Usuário"/>

        <label>Senha:</label>
        <input type="password" name="password" placeholder="Senha"/>

        <input type="submit" value="Login" />
    </form>
</div>
<a href="{% url 'Cadastro' %}">

    <button style="font-size: 40px;background-color: goldenrod; color: rgb(110, 7, 55); border-radius: 5px; position: relative; top: 7px;">Ainda não se cadastrou?</button>

</a>

{% endblock content %}
